sonar:
  executable: sonar-scanner
  pinned: '7.2.0.5079'
  version: [--version]
  macos: brew install sonar-scanner
  windows: >-
    Invoke-WebRequest 'https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.2.0.5079-windows-x64.zip' -OutFile sonar-scanner.zip;
    Expand-Archive sonar-scanner.zip -DestinationPath "$env:LOCALAPPDATA/secscan-tools";
    $env:Path += ";$env:LOCALAPPDATA/secscan-tools/sonar-scanner-7.2.0.5079-windows-x64/bin"
