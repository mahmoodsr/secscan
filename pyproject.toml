[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secscan"
version = "0.1.0"
description = "Manual code security and quality scanning"
requires-python = ">=3.9"
dependencies = ["PyYAML==6.0.3", "fastapi==0.115.12", "uvicorn==0.34.3", "keyring==25.6.0"]

[project.optional-dependencies]
test = ["jsonschema==4.26.0", "httpx==0.28.1"]

[project.scripts]
secscan = "secscan.cli:main"

[tool.setuptools]
packages = ["secscan"]
include-package-data = false

[tool.setuptools.package-data]
secscan = ["ui_static/index.html", "ui_static/assets/*", "data/*", "demo/expected.yml", "demo/*/Dockerfile", "demo/*/*.js", "demo/*/*.py", "demo/*/*.xml", "demo/*/*.txt", "demo/*/*.yml", "demo/*/rules/*.yml", "demo/*/src/main/java/demo/*.java"]
